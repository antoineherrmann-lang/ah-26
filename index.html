<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AH">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F3F5F2" media="(prefers-color-scheme: light)" data-for="light">
<meta name="theme-color" content="#0B110D" media="(prefers-color-scheme: dark)" data-for="dark">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>AH — Atelier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Google+Sans+Code:wght@400;500&display=swap" rel="stylesheet">
<script>
/* Applique le thème choisi avant le premier affichage (évite le flash). */
(function(){
  try{
    var t = (JSON.parse(localStorage.getItem('ah_settings')) || {}).theme;
    if(t === 'light' || t === 'dark'){
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.style.colorScheme = t;
    }
  }catch(e){}
})();
</script>
<style>
  :root{
    --brand-1:#01B673;
    --brand-2:#026524;
    --brand:#0E8A45;
    --paper:#F3F5F2;
    --card:#FFFFFF;
    --ink:#10170F;
    --ink-soft:#5E6B5C;
    --line:rgba(16,23,15,0.1);
    --track:rgba(16,23,15,0.08);
    --ok:#1C8A4E;
    --ko:#C0493C;
    --warn:#B7791F;
    --shadow:0 8px 26px rgba(16,23,15,0.09);
    --spring:cubic-bezier(.34,1.56,.64,1);
    --swift:cubic-bezier(.16,1,.3,1);
    --font:'Google Sans','Product Sans',-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
    --mono:'Google Sans Code',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  /* Sombre — forcé par l'utilisateur */
  :root[data-theme="dark"]{
    --brand:#2FC57F;
    --paper:#0B110D;
    --card:#141C15;
    --ink:#ECF2EA;
    --ink-soft:#8FA08C;
    --line:rgba(236,242,234,0.12);
    --track:rgba(236,242,234,0.1);
    --ok:#5BC47F;
    --ko:#E08479;
    --warn:#E0B45F;
    --shadow:0 8px 26px rgba(0,0,0,0.5);
  }
  /* Sombre — automatique, sauf si l'utilisateur a forcé le clair */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --brand:#2FC57F;
      --paper:#0B110D;
      --card:#141C15;
      --ink:#ECF2EA;
      --ink-soft:#8FA08C;
      --line:rgba(236,242,234,0.12);
      --track:rgba(236,242,234,0.1);
      --ok:#5BC47F;
      --ko:#E08479;
      --warn:#E0B45F;
      --shadow:0 8px 26px rgba(0,0,0,0.5);
    }
  }
  *{ box-sizing:border-box; touch-action:manipulation; }
  button{ color:inherit; font-family:inherit; -webkit-text-fill-color:currentColor; }
  html,body{ margin:0; }
  body{
    background:var(--paper); color:var(--ink);
    font-family:var(--font); font-weight:400;
    line-height:1.55; min-height:100vh; min-height:100dvh;
    padding:calc(env(safe-area-inset-top,0px) + 22px) 18px calc(env(safe-area-inset-bottom,0px) + 40px);
    max-width:600px; margin:0 auto;
    -webkit-font-smoothing:antialiased;
    transition:background-color .3s ease, color .3s ease;
  }
  :focus-visible{ outline:2px solid var(--brand); outline-offset:2px; }

  /* ---------- En-tête ---------- */
  .top{ display:flex; align-items:center; gap:14px; margin-bottom:26px; }
  .logo{
    width:52px; height:52px; border-radius:14px; flex-shrink:0;
    background:linear-gradient(155deg, var(--brand-1), var(--brand-2));
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:21px;
    color:rgba(255,255,255,.92); letter-spacing:-.01em;
    box-shadow:var(--shadow);
  }
  .top h1{ font-weight:700; font-size:24px; margin:0; letter-spacing:-.015em; line-height:1.15; }
  .top .sub{ font-size:13px; color:var(--ink-soft); margin-top:2px; }
  .top .grow{ flex:1; min-width:0; }

  /* Pastille de version */
  .ver{
    flex-shrink:0; align-self:flex-start;
    font-family:var(--mono); font-size:12px; font-weight:500;
    padding:5px 10px; border-radius:100px; cursor:pointer;
    background:rgba(1,182,115,.13); color:var(--brand);
    border:1px solid rgba(1,182,115,.28);
    transition:transform .24s var(--spring);
  }
  .ver:active{ transform:scale(.94); }

  /* ---------- Navigation ---------- */
  .back{
    display:inline-flex; align-items:center; gap:10px;
    min-height:50px; padding:0 22px 0 16px; margin-bottom:16px;
    background:var(--card); border:1px solid var(--line); border-radius:100px;
    box-shadow:var(--shadow);
    font-size:17px; font-weight:600; color:var(--brand); cursor:pointer;
    transition:transform .24s var(--spring);
  }
  .back:active{ transform:scale(.96); }
  .back-ar{ font-size:26px; line-height:1; margin-top:-2px; }

  /* ---------- Liste des modules ---------- */
  .lab{
    width:100%; display:flex; align-items:center; gap:14px; text-align:left;
    background:var(--card); border:1px solid var(--line); border-radius:17px;
    padding:16px 17px; margin-bottom:11px; cursor:pointer;
    box-shadow:var(--shadow);
    transition:transform .25s var(--spring);
  }
  .lab:active{ transform:scale(.98); }
  .lab-ico{ font-size:25px; flex-shrink:0; width:30px; text-align:center; }
  .lab-txt{ flex:1; min-width:0; }
  .lab-name{ display:block; font-weight:700; font-size:16px; }
  .lab-desc{ display:block; font-size:13px; color:var(--ink-soft); margin-top:2px; }
  .lab-tag{
    font-size:11.5px; font-weight:600;
    padding:4px 10px; border-radius:100px; flex-shrink:0;
  }
  .tag-live{ background:rgba(28,138,78,.14); color:var(--ok); }
  .tag-wip{ background:rgba(183,121,31,.14); color:var(--warn); }
  .lab[disabled]{ opacity:.5; cursor:default; }
  .lab[disabled]:active{ transform:none; }

  /* ---------- Blocs ---------- */
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:17px;
    padding:17px; margin-bottom:13px; box-shadow:var(--shadow);
  }
  .card-title{ font-weight:700; font-size:15px; margin-bottom:12px; }
  .hint{ font-size:13px; color:var(--ink-soft); }

  /* ---------- Sélecteur de thème ---------- */
  .seg{
    display:flex; gap:4px; padding:4px; border-radius:100px;
    background:var(--track);
  }
  .seg button{
    flex:1; border:none; background:none; cursor:pointer;
    padding:10px 6px; border-radius:100px;
    font-size:14px; font-weight:600; color:var(--ink-soft);
    transition:background-color .2s ease, color .2s ease, transform .24s var(--spring);
  }
  .seg button:active{ transform:scale(.96); }
  .seg button[aria-checked="true"]{
    background:var(--card); color:var(--ink);
    box-shadow:0 1px 6px rgba(0,0,0,.14);
  }
  .seg + .hint{ margin-top:10px; }

  /* ---------- Diagnostic ---------- */
  .check{ display:flex; align-items:flex-start; gap:11px; padding:9px 0; font-size:14px; }
  .check + .check{ border-top:1px solid var(--line); }
  .check-dot{ flex-shrink:0; width:18px; text-align:center; font-weight:700; }
  .check-dot.y{ color:var(--ok); } .check-dot.n{ color:var(--ko); }
  .check-body{ flex:1; min-width:0; }
  .check-sub{ display:block; font-size:12px; color:var(--ink-soft); margin-top:2px; }

  /* ---------- Boutons ---------- */
  .btn{
    width:100%; padding:14px; border-radius:100px; border:none; font-size:15px;
    font-weight:600; margin-top:9px; cursor:pointer;
    background:linear-gradient(150deg, var(--brand-1), var(--brand-2)); color:#fff;
    transition:transform .24s var(--spring), opacity .2s ease;
  }
  .btn:active{ transform:scale(.97); }
  .btn:disabled{ opacity:.35; }
  .btn.ghost{
    background:none; border:1.5px solid var(--line); color:var(--ink);
  }

  /* ---------- Bannière ---------- */
  .banner{
    background:rgba(183,121,31,.1); border:1px solid rgba(183,121,31,.3);
    border-radius:14px; padding:14px; font-size:13.5px; margin-bottom:13px;
  }
  .banner b{ display:block; margin-bottom:3px; }

  /* ---------- Journal ---------- */
  .log{
    font-family:var(--mono); font-size:11.5px;
    background:#08120A; color:#9FE3B4; border-radius:13px; padding:13px;
    white-space:pre-wrap; word-break:break-word; margin-top:12px;
    max-height:230px; overflow-y:auto; line-height:1.6;
  }
  .log:empty{ display:none; }

  input[type=text]{
    width:100%; padding:12px 13px; border-radius:11px; font-size:15px;
    font-family:inherit; color:var(--ink); background:var(--paper);
    border:1.5px solid var(--line); margin-top:8px;
  }

  /* ---------- Nouveautés ---------- */
  .rel-head{ display:flex; align-items:baseline; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .rel-ver{ font-family:var(--mono); font-weight:500; font-size:19px; letter-spacing:-.01em; }
  .rel-date{ font-size:13px; color:var(--ink-soft); }
  .rel-now{
    font-size:11.5px; font-weight:600; padding:3px 10px; border-radius:100px;
    background:rgba(28,138,78,.14); color:var(--ok);
  }
  .rel-title{ font-weight:600; font-size:14.5px; margin:-4px 0 12px; color:var(--ink-soft); }
  .rel-list{ list-style:none; margin:0; padding:0; }
  .rel-list li{ display:flex; gap:11px; align-items:flex-start; padding:8px 0; font-size:14px; }
  .rel-list li + li{ border-top:1px solid var(--line); }
  .kind{
    flex-shrink:0; width:64px; text-align:center;
    font-size:11.5px; font-weight:600; padding:3px 0; border-radius:8px; margin-top:1px;
  }
  .kind-new{ background:rgba(28,138,78,.14); color:var(--ok); }
  .kind-chg{ background:rgba(14,138,69,.0); color:var(--ink-soft); border:1px solid var(--line); }
  .kind-fix{ background:rgba(183,121,31,.14); color:var(--warn); }

  /* ---------- Mises à jour ---------- */
  .upd-banner{
    display:flex; align-items:center; gap:12px;
    background:rgba(1,182,115,.12); border:1px solid rgba(1,182,115,.35);
    border-radius:16px; padding:13px 14px; margin-bottom:14px; font-size:14px;
  }
  .upd-banner .txt{ flex:1; min-width:0; }
  .upd-banner b{ display:block; }
  .upd-banner small{ display:block; font-size:12.5px; color:var(--ink-soft); }
  .upd-banner button{
    flex-shrink:0; border:none; cursor:pointer; border-radius:100px;
    padding:11px 16px; font-size:14px; font-weight:600; color:#fff;
    background:linear-gradient(150deg, var(--brand-1), var(--brand-2));
  }
  .upd-line{ display:flex; align-items:center; gap:10px; font-size:14px; }
  .upd-dot{ width:10px; height:10px; border-radius:50%; flex-shrink:0; background:var(--ink-soft); }
  .upd-dot.ok{ background:var(--ok); } .upd-dot.new{ background:var(--brand-1); }
  .upd-dot.ko{ background:var(--ko); }
  .upd-dot.busy{ background:var(--warn); animation:pulse 1s ease-in-out infinite; }
  @keyframes pulse{ 50%{ opacity:.3; } }

  /* ---------- Pied de page ---------- */
  .foot{ text-align:center; margin-top:22px; }
  .foot button{
    background:none; border:none; cursor:pointer; padding:8px 12px;
    font-family:var(--mono); font-size:12px; color:var(--ink-soft);
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>

<div id="app"></div>

<script>
/* ============================================================
   AH — Atelier de tests
   Chaque expérience est un module indépendant déclaré dans LABS.
   Pour en ajouter une : une entrée dans LABS, et une fonction
   de rendu. Rien d'autre à toucher.
   ============================================================ */

/* ---------- Version et historique ----------
   À chaque livraison : monter APP_VERSION et ajouter une entrée
   EN TÊTE de CHANGELOG. kind : 'new' | 'chg' | 'fix'. */
const APP_VERSION = '0.3.0';

const KIND_LABEL = { new:'Nouveau', chg:'Modifié', fix:'Corrigé' };

const CHANGELOG = [
  {
    version:'0.3.0',
    date:'22 octobre 2026',
    title:'Mises à jour automatiques',
    items:[
      { kind:'new', text:'Recherche automatique de mise à jour au lancement et au retour dans l\'app.' },
      { kind:'new', text:'Bouton de recherche manuelle dans la carte Mises à jour, sur l\'accueil.' },
      { kind:'new', text:'Bandeau « Mettre à jour » quand une nouvelle version est disponible.' },
      { kind:'chg', text:'Boutons retour plus grands, faciles à toucher du pouce.' },
    ],
  },
  {
    version:'0.2.0',
    date:'22 octobre 2026',
    title:'Version, thème et typographie',
    items:[
      { kind:'new', text:'Numéro de version affiché en haut de l\'accueil et en bas de chaque écran.' },
      { kind:'new', text:'Écran Nouveautés avec l\'historique des versions.' },
      { kind:'new', text:'Choix du thème : Auto, Clair ou Sombre, mémorisé sur l\'appareil.' },
      { kind:'chg', text:'Police Google Sans partout, et Google Sans Code pour le journal.' },
      { kind:'fix', text:'L\'adresse du serveur n\'abîme plus le champ quand elle contient des caractères spéciaux.' },
    ],
  },
  {
    version:'0.1.0',
    date:'',
    title:'Première version',
    items:[
      { kind:'new', text:'Atelier modulaire : un catalogue d\'expériences, chacune indépendante.' },
      { kind:'new', text:'Module Notifications : diagnostic complet, test local, envoi via Cloudflare.' },
      { kind:'new', text:'Thème clair et sombre suivant le réglage de l\'iPhone.' },
    ],
  },
];

const STORE_KEY = 'ah_settings';

const store = {
  read(){
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
    catch(e){ return {}; }
  },
  write(obj){
    try { localStorage.setItem(STORE_KEY, JSON.stringify(obj)); } catch(e){}
  },
  get(k, def){ const v = this.read()[k]; return v === undefined ? def : v; },
  set(k, v){ const o = this.read(); o[k] = v; this.write(o); },
};

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* ---------- Thème : auto / clair / sombre ---------- */
const THEMES = [['auto','Auto'], ['light','Clair'], ['dark','Sombre']];
const THEME_COLOR = { light:'#F3F5F2', dark:'#0B110D' };

function applyTheme(mode){
  const root = document.documentElement;
  if(mode === 'light' || mode === 'dark'){
    root.setAttribute('data-theme', mode);
    root.style.colorScheme = mode;
  } else {
    root.removeAttribute('data-theme');
    root.style.colorScheme = '';
  }
  // Barre du navigateur : couleur imposée si thème forcé, sinon réglage système
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => {
    const own = m.getAttribute('data-for');
    m.setAttribute('content', (mode === 'light' || mode === 'dark') ? THEME_COLOR[mode] : THEME_COLOR[own]);
  });
}

function setTheme(mode){
  store.set('theme', mode);
  applyTheme(mode);
}

applyTheme(store.get('theme', 'auto'));

/* ---------- Environnement ---------- */
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
const isStandalone = window.navigator.standalone === true
  || window.matchMedia('(display-mode: standalone)').matches;

/* ---------- Catalogue des expériences ---------- */
const LABS = [
  {
    id:'push',
    icon:'🔔',
    name:'Notifications',
    desc:'Web Push iOS via Cloudflare',
    status:'live',
    render:renderPushLab,
  },
  // Les prochaines expériences viendront ici.
];

/* ---------- Routage ---------- */
let screen = { name:'home' };
const app = document.getElementById('app');

function render(){
  window.scrollTo(0,0);
  if(screen.name === 'home') renderHome();
  else if(screen.name === 'changelog') renderChangelog();
  else {
    const lab = LABS.find(l => l.id === screen.name);
    if(lab) lab.render();
    else { screen = { name:'home' }; renderHome(); }
  }
  if(screen.name !== 'changelog') addFooter();
  app.insertAdjacentHTML('afterbegin', '<div id="updBanner"></div>');
  paintUpdate();
}

function goHome(){ screen = { name:'home' }; render(); }
function goChangelog(){ screen = { name:'changelog' }; render(); }

function addFooter(){
  app.insertAdjacentHTML('beforeend',
    `<div class="foot"><button id="footVer" aria-label="Version ${APP_VERSION}, voir les nouveautés">AH ${APP_VERSION} · Nouveautés</button></div>`);
  document.getElementById('footVer').addEventListener('click', goChangelog);
}

function header(){
  return `
    <div class="top">
      <div class="logo">AH</div>
      <div class="grow">
        <h1>Atelier</h1>
        <div class="sub">Bac à sable, rien n'est en production ici</div>
      </div>
      <button class="ver" id="verBtn" aria-label="Version ${APP_VERSION}, voir les nouveautés">v${APP_VERSION}</button>
    </div>`;
}

/* ---------- Accueil ---------- */
function renderHome(){
  app.innerHTML = header() + LABS.map(l => `
    <button class="lab" data-lab="${l.id}" ${l.status==='wip'?'disabled':''}>
      <span class="lab-ico">${l.icon}</span>
      <span class="lab-txt">
        <span class="lab-name">${l.name}</span>
        <span class="lab-desc">${l.desc}</span>
      </span>
      <span class="lab-tag ${l.status==='live'?'tag-live':'tag-wip'}">
        ${l.status==='live'?'Prêt':'En cours'}
      </span>
    </button>`).join('') + `
    <div class="card">
      <div class="card-title">Apparence</div>
      <div class="seg" id="themeSeg" role="radiogroup" aria-label="Thème"></div>
      <div class="hint" id="themeHint"></div>
    </div>
    <div class="card" id="updCard"></div>`;

  document.querySelectorAll('[data-lab]').forEach(b => {
    if(b.hasAttribute('disabled')) return;
    b.addEventListener('click', () => { screen = { name:b.dataset.lab }; render(); });
  });
  document.getElementById('verBtn').addEventListener('click', goChangelog);
  renderThemeControl();
}

function renderThemeControl(){
  const cur = store.get('theme', 'auto');
  const seg = document.getElementById('themeSeg');
  if(!seg) return;
  seg.innerHTML = THEMES.map(([id,label]) =>
    `<button role="radio" data-theme-id="${id}" aria-checked="${id===cur}">${label}</button>`).join('');
  seg.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => { setTheme(b.dataset.themeId); renderThemeControl(); });
  });
  const hints = {
    auto:'Suit le réglage de l\'iPhone.',
    light:'Toujours clair, quel que soit l\'iPhone.',
    dark:'Toujours sombre, quel que soit l\'iPhone.',
  };
  document.getElementById('themeHint').textContent = hints[cur] || '';
}

/* ---------- Nouveautés ---------- */
function renderChangelog(){
  app.innerHTML = `
    <button class="back" id="back" aria-label="Retour à l'Atelier"><span class="back-ar">←</span>Atelier</button>
    <div class="top">
      <div class="logo">AH</div>
      <div class="grow">
        <h1>Nouveautés</h1>
        <div class="sub">Version actuelle : ${APP_VERSION}</div>
      </div>
    </div>
    ${CHANGELOG.map(r => `
      <div class="card">
        <div class="rel-head">
          <span class="rel-ver">${esc(r.version)}</span>
          ${r.version === APP_VERSION ? '<span class="rel-now">Actuelle</span>' : ''}
          ${r.date ? `<span class="rel-date">${esc(r.date)}</span>` : ''}
        </div>
        <div class="rel-title">${esc(r.title)}</div>
        <ul class="rel-list">
          ${r.items.map(i => `
            <li><span class="kind kind-${i.kind}">${KIND_LABEL[i.kind]}</span><span>${esc(i.text)}</span></li>`).join('')}
        </ul>
      </div>`).join('')}
  `;
  document.getElementById('back').addEventListener('click', goHome);
}

/* ============================================================
   MISES À JOUR
   Relit index.html en ligne (sans cache) et compare le numéro
   de version. Automatique au lancement et au retour dans l'app
   (au plus une fois par heure), manuel via le bouton.
   ============================================================ */
const UPDATE_EVERY = 60 * 60 * 1000;
const upd = {
  status:'idle',           // idle | checking | uptodate | available | error
  latest:null, title:'', msg:'',
  checkedAt: store.get('lastCheck', 0),
  attemptAt: 0,
};

function cmpVer(a, b){
  const x = a.split('.').map(Number), y = b.split('.').map(Number);
  for(let i=0;i<3;i++){
    const d = (x[i]||0) - (y[i]||0);
    if(d) return d > 0 ? 1 : -1;
  }
  return 0;
}

async function checkUpdate(manual){
  if(upd.status === 'checking') return;
  if(location.protocol === 'file:'){
    if(manual){ upd.status = 'error'; upd.msg = 'Indisponible en local, il faut la version en ligne.'; paintUpdate(); }
    return;
  }
  upd.status = 'checking'; upd.attemptAt = Date.now(); paintUpdate();
  try{
    const res = await fetch('./index.html?check=' + Date.now(), { cache:'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const html = await res.text();
    const m = html.match(/const APP_VERSION = '(\d+\.\d+\.\d+)'/);
    if(!m) throw new Error('numéro de version introuvable');
    const t = html.match(/version:'\d+\.\d+\.\d+',\s*date:'[^']*',\s*title:'([^']*)'/);
    upd.latest = m[1];
    upd.title = t ? t[1].replace(/\\'/g, "'") : '';
    upd.status = cmpVer(upd.latest, APP_VERSION) > 0 ? 'available' : 'uptodate';
    upd.checkedAt = Date.now();
    store.set('lastCheck', upd.checkedAt);
    // Vérifie aussi le service worker s'il est installé
    if('serviceWorker' in navigator){
      navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(()=>{});
    }
  }catch(e){
    upd.status = 'error';
    upd.msg = navigator.onLine === false ? 'Pas de connexion.' : 'Vérification impossible (' + e.message + ').';
  }
  paintUpdate();
}

function applyUpdate(){
  // Nouvelle adresse = le navigateur va chercher la page sur le réseau
  location.replace('./index.html?maj=' + Date.now());
}

function fmtDate(ts){
  if(!ts) return 'jamais';
  return new Date(ts).toLocaleString('fr-FR', { day:'numeric', month:'long', hour:'2-digit', minute:'2-digit' });
}

function paintUpdate(){
  const banner = document.getElementById('updBanner');
  if(banner){
    banner.innerHTML = upd.status === 'available' ? `
      <div class="upd-banner">
        <span class="txt"><b>Version ${esc(upd.latest)} disponible</b>${upd.title ? `<small>${esc(upd.title)}</small>` : ''}</span>
        <button id="updNow">Mettre à jour</button>
      </div>` : '';
    const b = document.getElementById('updNow');
    if(b) b.addEventListener('click', applyUpdate);
  }

  const card = document.getElementById('updCard');
  if(card){
    const map = {
      idle:      ['', 'Pas encore vérifié'],
      checking:  ['busy', 'Recherche en cours…'],
      uptodate:  ['ok', 'Tu as la dernière version (' + APP_VERSION + ')'],
      available: ['new', 'Version ' + (upd.latest||'') + ' disponible'],
      error:     ['ko', upd.msg],
    };
    const [dot, label] = map[upd.status];
    card.innerHTML = `
      <div class="card-title">Mises à jour</div>
      <div class="upd-line"><span class="upd-dot ${dot}"></span><span>${esc(label)}</span></div>
      <div class="hint" style="margin-top:6px">Dernière vérification : ${esc(fmtDate(upd.checkedAt))}</div>
      ${upd.status === 'available' ? '<button class="btn" id="updNow2">Installer la version ' + esc(upd.latest) + '</button>' : ''}
      <button class="btn ghost" id="updCheck" ${upd.status==='checking'?'disabled':''}>${upd.status==='checking'?'Recherche…':'Rechercher une mise à jour'}</button>`;
    document.getElementById('updCheck').addEventListener('click', () => checkUpdate(true));
    const n = document.getElementById('updNow2');
    if(n) n.addEventListener('click', applyUpdate);
  }
}

// Automatique : au lancement, puis au retour dans l'app (max 1 fois par heure)
setTimeout(() => checkUpdate(false), 600);
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && Date.now() - Math.max(upd.checkedAt, upd.attemptAt) > UPDATE_EVERY){
    checkUpdate(false);
  }
});

function log(msg){

  logLines.unshift(`[${t}] ${msg}`);

  const el = document.getElementById('log');

// La clé publique doit être convertie en octets pour l'API Push
function urlB64ToUint8Array(b64){
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const base64 = (b64 + pad).replace(/-/g,'+').replace(/_/g,'/');
  const raw = atob(base64);
  const out = new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) out[i] = raw.charCodeAt(i);
  return out;
}

async function runPushChecks(){
  const checks = [];
  const httpsOk = location.protocol === 'https:' || location.hostname === 'localhost';
  checks.push([httpsOk, 'Connexion sécurisée', 'Obligatoire pour les notifications']);

  checks.push([isStandalone, 'Lancée depuis l\'écran d\'accueil',
    isIOS ? 'Indispensable sur iPhone : depuis Safari, ça ne marchera jamais' : 'Recommandé']);

  const swOk = 'serviceWorker' in navigator;
  checks.push([swOk, 'Service worker supporté', '']);

  const pushOk = 'PushManager' in window;
  checks.push([pushOk, 'API Push disponible',
    (!pushOk && isIOS) ? 'Absente tant que l\'app n\'est pas sur l\'écran d\'accueil' : '']);

  const notifOk = 'Notification' in window;
  if(notifOk){
    const p = Notification.permission;
    checks.push([p === 'granted', 'Permission : ' + p,
      p === 'denied' ? 'Refusée — désinstalle puis réinstalle l\'app pour redemander' : '']);
  } else {
    checks.push([false, 'API Notification', 'Indisponible']);
  }

  let subscribed = false;
  if(swOk && httpsOk){
    try{
      swReg = await navigator.serviceWorker.register('./sw.js');
      await navigator.serviceWorker.ready;
      checks.push([true, 'Service worker actif', '']);
      const sub = await swReg.pushManager.getSubscription();
      subscribed = !!sub;
      checks.push([subscribed, subscribed ? 'Abonné' : 'Pas encore abonné', '']);
    }catch(e){
      checks.push([false, 'Service worker actif', e.message]);
    }
  }

  const checksEl = document.getElementById('checks');
  if(checksEl){
    checksEl.innerHTML = checks.map(([ok,label,sub]) => `
      <div class="check">
        <span class="check-dot ${ok?'y':'n'}">${ok?'✓':'✕'}</span>
        <span class="check-body">${label}${sub?`<span class="check-sub">${sub}</span>`:''}</span>
      </div>`).join('');
  }

  const bannerEl = document.getElementById('banner');
  if(bannerEl){
    bannerEl.innerHTML = (isIOS && !isStandalone) ? `
      <div class="banner">
        <b>Étape obligatoire sur iPhone</b>
        Appuie sur <strong>Partager</strong> puis <strong>Sur l'écran d'accueil</strong>,
        et rouvre l'app depuis son icône. Les notifications ne fonctionnent pas depuis Safari.
      </div>` : '';
  }

  const workerUrl = store.get('workerUrl','');
  const canSub = httpsOk && swOk && pushOk && notifOk && swReg && !subscribed;
  const set = (id, cond) => { const el = document.getElementById(id); if(el) el.disabled = !cond; };
  set('subBtn', canSub);
  set('localBtn', swReg && notifOk && Notification.permission === 'granted');
  set('remoteBtn', subscribed && !!workerUrl);
  set('unsubBtn', subscribed);
}

// iOS exige que la demande parte d'un vrai geste de l'utilisateur
async function doSubscribe(){
  try{
    log('Demande de permission…');
    const perm = await Notification.requestPermission();
    log('Permission : ' + perm);
    if(perm !== 'granted'){
      log('Refusé. Désinstalle et réinstalle l\'app pour redemander.');
      return;
    }
    log('Création de l\'abonnement…');
    const sub = await swReg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlB64ToUint8Array(VAPID_PUBLIC_KEY),
    });
    log('Abonnement obtenu.');

    const workerUrl = store.get('workerUrl','');
    if(workerUrl){
      const res = await fetch(workerUrl + '/subscribe', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(sub),
      });
      log(res.ok ? 'Transmis au serveur ✓' : 'Erreur serveur : ' + res.status);
    } else {
      log('Pas de serveur configuré — abonnement local seulement.');
    }
    runPushChecks();
  }catch(e){
    log('ERREUR : ' + e.message);
  }
}

}

async function doUnsubscribe(){
  try{
    const sub = await swReg.pushManager.getSubscription();
    if(sub){
      const workerUrl = store.get('workerUrl','');
      if(workerUrl){
        await fetch(workerUrl + '/unsubscribe', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ endpoint: sub.endpoint }),
        }).catch(()=>{});
      }
      await sub.unsubscribe();
      log('Désabonné.');
    }
    runPushChecks();
  }catch(e){ log('ERREUR : ' + e.message); }
}
