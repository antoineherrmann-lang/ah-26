<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AH">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F3F5F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B110D" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>AH — Atelier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand-1:#01B673;
    --brand-2:#026524;
    --brand:#0E8A45;
    --paper:#F3F5F2;
    --card:#FFFFFF;
    --ink:#10170F;
    --ink-soft:#5E6B5C;
    --line:rgba(16,23,15,0.1);
    --track:rgba(16,23,15,0.08);
    --ok:#1C8A4E;
    --ko:#C0493C;
    --warn:#B7791F;
    --shadow:0 8px 26px rgba(16,23,15,0.09);
    --spring:cubic-bezier(.34,1.56,.64,1);
    --swift:cubic-bezier(.16,1,.3,1);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#0B110D;
      --card:#141C15;
      --ink:#ECF2EA;
      --ink-soft:#8FA08C;
      --line:rgba(236,242,234,0.12);
      --track:rgba(236,242,234,0.1);
      --ok:#5BC47F;
      --ko:#E08479;
      --warn:#E0B45F;
      --shadow:0 8px 26px rgba(0,0,0,0.5);
    }
  }
  *{ box-sizing:border-box; touch-action:manipulation; }
  button{ color:inherit; font-family:inherit; -webkit-text-fill-color:currentColor; }
  html,body{ margin:0; }
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Instrument Sans',-apple-system,BlinkMacSystemFont,sans-serif;
    line-height:1.55; min-height:100vh; min-height:100dvh;
    padding:calc(env(safe-area-inset-top,0px) + 22px) 18px calc(env(safe-area-inset-bottom,0px) + 40px);
    max-width:600px; margin:0 auto;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- En-tête ---------- */
  .top{ display:flex; align-items:center; gap:14px; margin-bottom:26px; }
  .logo{
    width:52px; height:52px; border-radius:14px; flex-shrink:0;
    background:linear-gradient(155deg, var(--brand-1), var(--brand-2));
    display:flex; align-items:center; justify-content:center;
    font-family:'Unbounded',sans-serif; font-weight:800; font-size:19px;
    color:rgba(255,255,255,.92); letter-spacing:-.02em;
    box-shadow:var(--shadow);
  }
  .top h1{ font-family:'Unbounded',sans-serif; font-weight:800; font-size:21px; margin:0; letter-spacing:-.01em; }
  .top .sub{ font-size:12.5px; color:var(--ink-soft); margin-top:1px; }

  /* ---------- Navigation ---------- */
  .back{
    display:inline-flex; align-items:center; gap:7px; background:none; border:none;
    font-size:13.5px; font-weight:600; color:var(--brand); padding:8px 0; margin-bottom:6px;
    cursor:pointer;
  }

  /* ---------- Liste des modules ---------- */
  .lab{
    width:100%; display:flex; align-items:center; gap:14px; text-align:left;
    background:var(--card); border:1px solid var(--line); border-radius:17px;
    padding:16px 17px; margin-bottom:11px; cursor:pointer;
    box-shadow:var(--shadow);
    transition:transform .25s var(--spring);
  }
  .lab:active{ transform:scale(.98); }
  .lab-ico{ font-size:25px; flex-shrink:0; width:30px; text-align:center; }
  .lab-txt{ flex:1; min-width:0; }
  .lab-name{ display:block; font-family:'Unbounded',sans-serif; font-weight:600; font-size:15px; }
  .lab-desc{ display:block; font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .lab-tag{
    font-size:9.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
    padding:4px 9px; border-radius:100px; flex-shrink:0;
  }
  .tag-live{ background:rgba(28,138,78,.14); color:var(--ok); }
  .tag-wip{ background:rgba(183,121,31,.14); color:var(--warn); }
  .lab[disabled]{ opacity:.5; cursor:default; }
  .lab[disabled]:active{ transform:none; }

  /* ---------- Blocs ---------- */
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:17px;
    padding:17px; margin-bottom:13px; box-shadow:var(--shadow);
  }
  .card-title{
    font-family:'Unbounded',sans-serif; font-weight:600; font-size:13.5px; margin-bottom:12px;
  }
  .hint{ font-size:12.5px; color:var(--ink-soft); }

  /* ---------- Diagnostic ---------- */
  .check{ display:flex; align-items:flex-start; gap:11px; padding:9px 0; font-size:13.5px; }
  .check + .check{ border-top:1px solid var(--line); }
  .check-dot{ flex-shrink:0; width:18px; text-align:center; font-weight:700; }
  .check-dot.y{ color:var(--ok); } .check-dot.n{ color:var(--ko); }
  .check-body{ flex:1; min-width:0; }
  .check-sub{ display:block; font-size:11.5px; color:var(--ink-soft); margin-top:2px; }

  /* ---------- Boutons ---------- */
  .btn{
    width:100%; padding:14px; border-radius:100px; border:none; font-size:14.5px;
    font-weight:700; margin-top:9px; cursor:pointer;
    background:linear-gradient(150deg, var(--brand-1), var(--brand-2)); color:#fff;
    transition:transform .24s var(--spring), opacity .2s ease;
  }
  .btn:active{ transform:scale(.97); }
  .btn:disabled{ opacity:.35; }
  .btn.ghost{
    background:none; border:1.5px solid var(--line); color:var(--ink);
  }

  /* ---------- Bannière ---------- */
  .banner{
    background:rgba(183,121,31,.1); border:1px solid rgba(183,121,31,.3);
    border-radius:14px; padding:14px; font-size:13px; margin-bottom:13px;
  }
  .banner b{ display:block; margin-bottom:3px; }

  /* ---------- Journal ---------- */
  .log{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px;
    background:#08120A; color:#9FE3B4; border-radius:13px; padding:13px;
    white-space:pre-wrap; word-break:break-word; margin-top:12px;
    max-height:230px; overflow-y:auto; line-height:1.6;
  }
  .log:empty{ display:none; }

  input[type=text]{
    width:100%; padding:12px 13px; border-radius:11px; font-size:14px;
    font-family:inherit; color:var(--ink); background:var(--paper);
    border:1.5px solid var(--line); margin-top:8px;
  }
</style>
</head>
<body>

<div id="app"></div>

<script>
/* ============================================================
   AH — Atelier de tests
   Chaque expérience est un module indépendant déclaré dans LABS.
   Pour en ajouter une : une entrée dans LABS, et une fonction
   de rendu. Rien d'autre à toucher.
   ============================================================ */

const STORE_KEY = 'ah_settings';

const store = {
  read(){
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
    catch(e){ return {}; }
  },
  write(obj){
    try { localStorage.setItem(STORE_KEY, JSON.stringify(obj)); } catch(e){}
  },
  get(k, def){ const v = this.read()[k]; return v === undefined ? def : v; },
  set(k, v){ const o = this.read(); o[k] = v; this.write(o); },
};

/* ---------- Environnement ---------- */
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
const isStandalone = window.navigator.standalone === true
  || window.matchMedia('(display-mode: standalone)').matches;

/* ---------- Catalogue des expériences ---------- */
const LABS = [
  {
    id:'push',
    icon:'🔔',
    name:'Notifications',
    desc:'Web Push iOS via Cloudflare',
    status:'live',
    render:renderPushLab,
  },
  // Les prochaines expériences viendront ici.
];

/* ---------- Routage ---------- */
let screen = { name:'home' };
const app = document.getElementById('app');

function render(){
  window.scrollTo(0,0);
  if(screen.name === 'home') return renderHome();
  const lab = LABS.find(l => l.id === screen.name);
  if(lab) return lab.render();
  screen = { name:'home' };
  renderHome();
}

function goHome(){ screen = { name:'home' }; render(); }

function header(){
  return `
    <div class="top">
      <div class="logo">AH</div>
      <div>
        <h1>Atelier</h1>
        <div class="sub">Bac à sable — rien n'est en production ici</div>
      </div>
    </div>`;
}

/* ---------- Accueil ---------- */
function renderHome(){
  app.innerHTML = header() + LABS.map(l => `
    <button class="lab" data-lab="${l.id}" ${l.status==='wip'?'disabled':''}>
      <span class="lab-ico">${l.icon}</span>
      <span class="lab-txt">
        <span class="lab-name">${l.name}</span>
        <span class="lab-desc">${l.desc}</span>
      </span>
      <span class="lab-tag ${l.status==='live'?'tag-live':'tag-wip'}">
        ${l.status==='live'?'Prêt':'En cours'}
      </span>
    </button>`).join('');

  document.querySelectorAll('[data-lab]').forEach(b => {
    if(b.hasAttribute('disabled')) return;
    b.addEventListener('click', () => { screen = { name:b.dataset.lab }; render(); });
  });
}

/* ============================================================
   MODULE : Notifications push
   ============================================================ */

const VAPID_PUBLIC_KEY = 'BJnq8VQq2JOwz_AkWCe9l2GctIX5bHiH2I0nVuX3y1BWOsrPis7KAkDAjKO8KLkR9YUeNk-X6Kung8lCc0gr7gc';

let swReg = null;
let logLines = [];

function log(msg){
  const t = new Date().toLocaleTimeString('fr-FR');
  logLines.unshift(`[${t}] ${msg}`);
  logLines = logLines.slice(0, 40);
  const el = document.getElementById('log');
  if(el) el.textContent = logLines.join('\n');
}

// La clé publique doit être convertie en octets pour l'API Push
function urlB64ToUint8Array(b64){
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const base64 = (b64 + pad).replace(/-/g,'+').replace(/_/g,'/');
  const raw = atob(base64);
  const out = new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) out[i] = raw.charCodeAt(i);
  return out;
}

function renderPushLab(){
  const workerUrl = store.get('workerUrl', '');

  app.innerHTML = `
    <button class="back" id="back">← Atelier</button>
    <div class="top">
      <div class="logo">🔔</div>
      <div>
        <h1>Notifications</h1>
        <div class="sub">Web Push iOS via Cloudflare</div>
      </div>
    </div>

    <div id="banner"></div>

    <div class="card">
      <div class="card-title">Diagnostic</div>
      <div id="checks"></div>
    </div>

    <div class="card">
      <div class="card-title">Serveur</div>
      <div class="hint">Adresse du Worker Cloudflare. Laisse vide pour tester sans serveur.</div>
      <input type="text" id="workerUrl" placeholder="https://ah-push.xxx.workers.dev" value="${workerUrl}">
      <button class="btn ghost" id="saveUrl">Enregistrer</button>
    </div>

    <div class="card">
      <div class="card-title">Actions</div>
      <button class="btn" id="subBtn" disabled>Activer les notifications</button>
      <button class="btn ghost" id="localBtn" disabled>Tester une notification locale</button>
      <button class="btn ghost" id="remoteBtn" disabled>Demander un envoi au serveur</button>
      <button class="btn ghost" id="unsubBtn" disabled>Se désabonner</button>
      <div class="log" id="log"></div>
    </div>
  `;

  document.getElementById('back').addEventListener('click', goHome);
  document.getElementById('log').textContent = logLines.join('\n');

  document.getElementById('saveUrl').addEventListener('click', () => {
    const v = document.getElementById('workerUrl').value.trim().replace(/\/+$/,'');
    store.set('workerUrl', v);
    log(v ? 'Serveur enregistré : ' + v : 'Serveur effacé.');
    runPushChecks();
  });

  document.getElementById('subBtn').addEventListener('click', doSubscribe);
  document.getElementById('localBtn').addEventListener('click', doLocalTest);
  document.getElementById('remoteBtn').addEventListener('click', doRemoteTest);
  document.getElementById('unsubBtn').addEventListener('click', doUnsubscribe);

  runPushChecks();
}

async function runPushChecks(){
  const checks = [];
  const httpsOk = location.protocol === 'https:' || location.hostname === 'localhost';
  checks.push([httpsOk, 'Connexion sécurisée', 'Obligatoire pour les notifications']);

  checks.push([isStandalone, 'Lancée depuis l\'écran d\'accueil',
    isIOS ? 'Indispensable sur iPhone : depuis Safari, ça ne marchera jamais' : 'Recommandé']);

  const swOk = 'serviceWorker' in navigator;
  checks.push([swOk, 'Service worker supporté', '']);

  const pushOk = 'PushManager' in window;
  checks.push([pushOk, 'API Push disponible',
    (!pushOk && isIOS) ? 'Absente tant que l\'app n\'est pas sur l\'écran d\'accueil' : '']);

  const notifOk = 'Notification' in window;
  if(notifOk){
    const p = Notification.permission;
    checks.push([p === 'granted', 'Permission : ' + p,
      p === 'denied' ? 'Refusée — désinstalle puis réinstalle l\'app pour redemander' : '']);
  } else {
    checks.push([false, 'API Notification', 'Indisponible']);
  }

  let subscribed = false;
  if(swOk && httpsOk){
    try{
      swReg = await navigator.serviceWorker.register('./sw.js');
      await navigator.serviceWorker.ready;
      checks.push([true, 'Service worker actif', '']);
      const sub = await swReg.pushManager.getSubscription();
      subscribed = !!sub;
      checks.push([subscribed, subscribed ? 'Abonné' : 'Pas encore abonné', '']);
    }catch(e){
      checks.push([false, 'Service worker actif', e.message]);
    }
  }

  const checksEl = document.getElementById('checks');
  if(checksEl){
    checksEl.innerHTML = checks.map(([ok,label,sub]) => `
      <div class="check">
        <span class="check-dot ${ok?'y':'n'}">${ok?'✓':'✕'}</span>
        <span class="check-body">${label}${sub?`<span class="check-sub">${sub}</span>`:''}</span>
      </div>`).join('');
  }

  const bannerEl = document.getElementById('banner');
  if(bannerEl){
    bannerEl.innerHTML = (isIOS && !isStandalone) ? `
      <div class="banner">
        <b>Étape obligatoire sur iPhone</b>
        Appuie sur <strong>Partager</strong> puis <strong>Sur l'écran d'accueil</strong>,
        et rouvre l'app depuis son icône. Les notifications ne fonctionnent pas depuis Safari.
      </div>` : '';
  }

  const workerUrl = store.get('workerUrl','');
  const canSub = httpsOk && swOk && pushOk && notifOk && swReg && !subscribed;
  const set = (id, cond) => { const el = document.getElementById(id); if(el) el.disabled = !cond; };
  set('subBtn', canSub);
  set('localBtn', swReg && notifOk && Notification.permission === 'granted');
  set('remoteBtn', subscribed && !!workerUrl);
  set('unsubBtn', subscribed);
}

// iOS exige que la demande parte d'un vrai geste de l'utilisateur
async function doSubscribe(){
  try{
    log('Demande de permission…');
    const perm = await Notification.requestPermission();
    log('Permission : ' + perm);
    if(perm !== 'granted'){
      log('Refusé. Désinstalle et réinstalle l\'app pour redemander.');
      return;
    }
    log('Création de l\'abonnement…');
    const sub = await swReg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlB64ToUint8Array(VAPID_PUBLIC_KEY),
    });
    log('Abonnement obtenu.');

    const workerUrl = store.get('workerUrl','');
    if(workerUrl){
      const res = await fetch(workerUrl + '/subscribe', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(sub),
      });
      log(res.ok ? 'Transmis au serveur ✓' : 'Erreur serveur : ' + res.status);
    } else {
      log('Pas de serveur configuré — abonnement local seulement.');
    }
    runPushChecks();
  }catch(e){
    log('ERREUR : ' + e.message);
  }
}

// Vérifie l'affichage sans passer par le réseau
async function doLocalTest(){
  try{
    await swReg.showNotification('AH — test local', {
      body: 'Si tu vois ceci, l\'affichage fonctionne.',
      icon: './icon-192.png', tag: 'ah-local',
    });
    log('Notification locale affichée.');
  }catch(e){ log('ERREUR : ' + e.message); }
}

// Déclenche un vrai envoi depuis le serveur : teste toute la chaîne
async function doRemoteTest(){
  const workerUrl = store.get('workerUrl','');
  if(!workerUrl) return;
  try{
    log('Demande d\'envoi au serveur…');
    const res = await fetch(workerUrl + '/test');
    const data = await res.json();
    log(JSON.stringify(data, null, 1));
    if(data.envoyés > 0) log('Envoi accepté — la notification devrait arriver.');
  }catch(e){ log('ERREUR : ' + e.message); }
}

async function doUnsubscribe(){
  try{
    const sub = await swReg.pushManager.getSubscription();
    if(sub){
      const workerUrl = store.get('workerUrl','');
      if(workerUrl){
        await fetch(workerUrl + '/unsubscribe', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ endpoint: sub.endpoint }),
        }).catch(()=>{});
      }
      await sub.unsubscribe();
      log('Désabonné.');
    }
    runPushChecks();
  }catch(e){ log('ERREUR : ' + e.message); }
}

render();
</script>
</body>
</html>
